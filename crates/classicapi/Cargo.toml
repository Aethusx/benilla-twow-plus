[package]
name = "classicapi"
version.workspace = true
edition.workspace = true
description = "ClassicAPI on top of benilla: the modern C_* API, Lua 5.1 compatibility and the bundled !!!ClassicAPI addon, through benilla's extension seams"

[lints]
workspace = true

[features]
default = ["dev"]
# The instruments; the player build is `--no-default-features`.
dev = ["benilla-app/dev"]

[dependencies]
# `default-features = false`, or `--no-default-features` still builds benilla-app with `dev`.
benilla-app = { path = "../benilla-app", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-protocol = { path = "../benilla-protocol" }
benilla-ui = { path = "../benilla-ui" }
benilla-world = { path = "../benilla-world", default-features = false }
bevy.workspace = true
# `C_EncodingUtil`'s Deflate / Zlib / Gzip and JSON, both already in the workspace's tree.
flate2 = "1.1"
mlua = { version = "0.11", features = ["lua51", "vendored"] }
serde_json = "1"

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "benilla-classicapi"
path = "src/main.rs"
test = false
